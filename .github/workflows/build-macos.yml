name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publier une Release GitHub avec ce tag (ex. v1.0.0). Laisser vide pour un simple build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: AuraClean (Universal arm64 + x86_64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.4-${{ runner.os }}

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        id: package
        run: |
          set -euo pipefail
          APP=$(find build -type d -name "AuraClean.app" -path "*Release*" | head -n 1)
          if [ -z "$APP" ]; then APP=$(find build -type d -name "AuraClean.app" | head -n 1); fi
          echo "App trouvée : $APP"
          lipo -info "$APP/Contents/MacOS/AuraClean"

          # Signature ad-hoc (pas de certificat Developer ID dans la CI)
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/AuraClean-macOS.zip"

          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "AuraClean" -srcfolder "$STAGE" -ov -format UDZO "dist/AuraClean-macOS.dmg"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraClean-macOS
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: AuraClean ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
